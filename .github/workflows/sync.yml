name: Sync LeetCode metrics

on:
  schedule:
    # 02:17 UTC / 10:17 Asia/Shanghai; avoid the busy top of the hour.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leetcode-metrics-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Sync data
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          LEETCODE_SITE: ${{ vars.LEETCODE_SITE || 'com' }}
        run: python scripts/sync.py

      - name: Commit changed data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update leetcode metrics"
          git push origin "HEAD:$DEFAULT_BRANCH"
